[project]
name = "aula"
version = "0.1.0"
description = "Baja material, grabaciones y entregas pendientes del Aula Virtual UPC (Blackboard Ultra)"
requires-python = ">=3.11"
dependencies = ["playwright>=1.64.0", "typer>=0.27.3"]

[project.scripts]
aula = "aula.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aula"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# typer declara sus opciones como valores por defecto; es su API, no un descuido.
extend-ignore = ["B008"]
